<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哔哩哔哩大鲸鱼 · 控制台</title>
  <style>
:root {
  --bg-1: var(--color-background-primary, #ffffff);
  --bg-2: var(--color-background-secondary, #f5f6f8);
  --bg-3: var(--color-background-tertiary, #eceef2);
  --fg-1: var(--color-text-primary, #17191c);
  --fg-2: var(--color-text-secondary, #4b5563);
  --fg-3: var(--color-text-tertiary, #6b7280);
  --border-1: var(--color-border-primary, #d8dce3);
  --border-2: var(--color-border-secondary, #e5e7eb);
  --accent: var(--color-ring-primary, #0ea5e9);
  --accent-bg: var(--color-background-inverse, #0f172a);
  --accent-fg: var(--color-text-inverse, #ffffff);
  --ok: var(--color-text-success, #16a34a);
  --warn: var(--color-text-warning, #d97706);
  --err: var(--color-text-danger, #dc2626);
  --info-bg: var(--color-background-info, rgba(14, 165, 233, 0.12));
  --font: var(--font-sans, "Segoe UI", system-ui, -apple-system, sans-serif);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-1);
  color: var(--fg-1);
  font-family: var(--font);
  font-size: 13.5px;
  line-height: 1.55;
}

.app-shell {
  max-width: 1040px;
  margin: 0 auto;
  padding: 18px 22px 48px;
}

.loading-box {
  padding: 48px 16px;
  text-align: center;
  color: var(--fg-3);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-2);
  margin-bottom: 14px;
}

.brand {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.brand h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  color: var(--fg-2);
  white-space: nowrap;
}

.pill.ok {
  color: var(--ok);
  background: color-mix(in srgb, var(--ok) 10%, transparent);
  border-color: color-mix(in srgb, var(--ok) 32%, transparent);
}
.pill.warn {
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 10%, transparent);
  border-color: color-mix(in srgb, var(--warn) 36%, transparent);
}
.pill.err {
  color: var(--err);
  background: color-mix(in srgb, var(--err) 10%, transparent);
  border-color: color-mix(in srgb, var(--err) 36%, transparent);
}
.pill.info {
  color: var(--accent);
  background: var(--info-bg);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-2);
  padding-bottom: 10px;
}

.tab-btn {
  background: transparent;
  color: var(--fg-2);
  border: 1px solid transparent;
  border-radius: 7px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.tab-btn:hover { background: var(--bg-2); color: var(--fg-1); }
.tab-btn.active {
  background: var(--info-bg);
  color: var(--fg-1);
  border-color: color-mix(in srgb, var(--accent) 42%, transparent);
}

.badge-count {
  display: inline-block;
  margin-left: 5px;
  padding: 0 6px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--accent-bg);
  color: var(--accent-fg);
}

.card {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  padding: 15px 17px;
  margin-bottom: 14px;
}

.card h2 {
  margin: 0 0 10px;
  font-size: 14.5px;
  font-weight: 600;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 8px;
}

.card-head h2 { margin: 0; }

.card-sub {
  margin: -2px 0 12px;
  font-size: 12.5px;
  color: var(--fg-3);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 10px 18px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-2);
}

.row:last-child { border-bottom: none; padding-bottom: 2px; }
.row-info { flex: 1; min-width: 210px; }
.row-label { font-weight: 500; }
.row-hint { font-size: 12px; color: var(--fg-3); margin-top: 2px; }

.input, .select, .textarea {
  background: var(--bg-1);
  color: var(--fg-1);
  border: 1px solid var(--border-1);
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.input, .select {
  height: 30px;
  padding: 0 9px;
  min-width: 200px;
}

.input.wide { min-width: 290px; }
.input.sm { width: 84px; min-width: 84px; }
.input.xs { width: 62px; min-width: 62px; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
.input[readonly] { opacity: 0.72; background: var(--bg-3); }

.textarea {
  width: 100%;
  padding: 9px 10px;
  resize: vertical;
  line-height: 1.55;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border-1);
  background: var(--bg-1);
  color: var(--fg-1);
  transition: background 0.12s ease, opacity 0.12s ease;
}

.btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
.btn:hover:not(:disabled) { background: var(--bg-3); }
.btn.primary {
  background: var(--accent-bg);
  color: var(--accent-fg);
  border-color: transparent;
}
.btn.primary:hover:not(:disabled) { opacity: 0.88; }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.btn:disabled { opacity: 0.5; cursor: default; }

.switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.switch input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}

.stat-tile {
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 10px 12px;
}
.stat-k { font-size: 12px; color: var(--fg-3); }
.stat-v { font-size: 14.5px; font-weight: 600; margin-top: 3px; word-break: break-word; }

/* Account Hero */
.account-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: 9px;
  padding: 14px 16px;
  margin-bottom: 12px;
}

.account-meta {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-width: 240px;
}

.account-name-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.account-name {
  font-size: 16px;
  font-weight: 600;
}

.qr-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  min-width: 220px;
}
.qr-img {
  width: 184px;
  height: 184px;
  border-radius: 8px;
  background: #ffffff;
  padding: 6px;
  border: 1px solid var(--border-2);
}

/* Model Picker UI */
.role-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}

.role-card {
  text-align: left;
  width: 100%;
  background: var(--bg-1);
  border: 1.5px solid var(--border-2);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  color: var(--fg-1);
  font-family: inherit;
  transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
}

.role-card:hover {
  border-color: var(--border-1);
  background: color-mix(in srgb, var(--bg-1) 92%, var(--accent) 8%);
}

.role-card.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent);
}

.role-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.role-card-title {
  font-size: 13.5px;
  font-weight: 600;
}

.role-card-desc {
  font-size: 12px;
  color: var(--fg-3);
  margin-bottom: 8px;
}

.role-card-val {
  font-size: 14px;
  font-weight: 600;
  color: var(--fg-1);
}

.role-card-id {
  font-size: 11.5px;
  color: var(--fg-3);
  margin-top: 2px;
}

.model-section-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--fg-3);
  margin: 14px 0 8px;
  letter-spacing: 0.02em;
}

.model-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.model-group {
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: 9px;
  padding: 12px 14px;
  transition: border-color 0.14s ease;
}

.model-group.has-active {
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  background: color-mix(in srgb, var(--bg-1) 96%, var(--accent) 4%);
}

.model-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin-bottom: 8px;
}

.model-title-wrap {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}

.model-name {
  font-size: 14px;
  font-weight: 600;
}

.model-tag {
  font-size: 11px;
  font-weight: 500;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--border-2);
  background: var(--bg-2);
  color: var(--fg-2);
}

.model-tag.new {
  color: var(--accent);
  background: var(--info-bg);
  border-color: color-mix(in srgb, var(--accent) 32%, transparent);
}
.model-tag.warn {
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 12%, transparent);
  border-color: color-mix(in srgb, var(--warn) 35%, transparent);
}
.model-tag.ok {
  color: var(--ok);
  background: color-mix(in srgb, var(--ok) 10%, transparent);
  border-color: color-mix(in srgb, var(--ok) 30%, transparent);
}

.quota-wrap {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--fg-3);
}

.quota-bar {
  width: 58px;
  height: 5px;
  border-radius: 999px;
  background: var(--bg-3);
  overflow: hidden;
}

.quota-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--ok);
}
.quota-fill.mid { background: var(--warn); }
.quota-fill.low { background: var(--err); }

.model-desc {
  font-size: 12px;
  color: var(--fg-3);
  margin: -2px 0 8px;
}

.effort-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}

.effort-label {
  font-size: 12px;
  color: var(--fg-3);
  margin-right: 2px;
}

.effort-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 29px;
  padding: 0 11px;
  border-radius: 7px;
  border: 1px solid var(--border-1);
  background: var(--bg-2);
  color: var(--fg-1);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s ease;
}

.effort-btn:hover {
  border-color: var(--accent);
  background: var(--info-bg);
}

.effort-btn.active {
  background: var(--accent-bg);
  color: var(--accent-fg);
  border-color: transparent;
}

.effort-btn.other-role {
  border-style: dashed;
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
}

.effort-badge {
  font-size: 10.5px;
  padding: 0 5px;
  border-radius: 4px;
  background: color-mix(in srgb, currentColor 14%, transparent);
}

/* Dependency Health Cards */
.deps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 11px;
  margin-top: 10px;
}

.dep-card {
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-left: 3px solid var(--border-1);
  border-radius: 9px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dep-card.ok { border-left-color: var(--ok); }
.dep-card.optional { border-left-color: var(--warn); }
.dep-card.error { border-left-color: var(--err); }

.dep-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.dep-name {
  font-weight: 600;
  font-size: 13.5px;
}

.dep-ver {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg-1);
  word-break: break-word;
}

.dep-path {
  font-family: Consolas, ui-monospace, monospace;
  font-size: 11.5px;
  color: var(--fg-3);
  background: var(--bg-2);
  border-radius: 5px;
  padding: 3px 7px;
  word-break: break-all;
}

.dep-detail {
  font-size: 12px;
  color: var(--fg-2);
  line-height: 1.5;
}

.dep-fix {
  font-size: 12px;
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 9%, transparent);
  border-radius: 6px;
  padding: 6px 8px;
  line-height: 1.45;
}

.dep-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 2px;
}

/* Tag Chips Editor */
.tag-editor {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1.25;
  min-width: 280px;
  max-width: 560px;
}

.tag-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 28px;
}

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px 3px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  border: 1px solid var(--border-1);
  background: var(--bg-1);
  color: var(--fg-1);
}

.tag-chip.like {
  background: var(--info-bg);
  border-color: color-mix(in srgb, var(--accent) 38%, transparent);
}

.tag-chip.dislike {
  background: color-mix(in srgb, var(--err) 9%, transparent);
  border-color: color-mix(in srgb, var(--err) 30%, transparent);
}

.tag-chip-rm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--fg-2);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
}

.tag-chip-rm:hover {
  background: color-mix(in srgb, var(--fg-1) 14%, transparent);
  color: var(--fg-1);
}

.tag-input-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}

.tag-suggest {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}

.tag-suggest-label {
  font-size: 11.5px;
  color: var(--fg-3);
  margin-right: 2px;
}

.tag-suggest-btn {
  border: 1px dashed var(--border-1);
  background: transparent;
  color: var(--fg-2);
  border-radius: 999px;
  padding: 2px 9px;
  font-family: inherit;
  font-size: 11.5px;
  cursor: pointer;
  transition: all 0.12s ease;
}

.tag-suggest-btn:hover:not(:disabled) {
  border-style: solid;
  border-color: var(--accent);
  color: var(--fg-1);
  background: var(--info-bg);
}

.tag-suggest-btn:disabled {
  opacity: 0.42;
  cursor: default;
}

/* About & Update */
.about-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 14px;
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: 9px;
  padding: 14px 16px;
  margin-bottom: 12px;
}

.about-title {
  font-size: 16.5px;
  font-weight: 600;
}

.link-btn {
  color: var(--accent);
  text-decoration: none;
  font-family: Consolas, ui-monospace, monospace;
  font-size: 12.5px;
  word-break: break-all;
}

.link-btn:hover { text-decoration: underline; }

.counter-err { color: var(--err); font-weight: 500; }

/* Watch 3-tier visual strip */
.rule-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}

.rule-tier {
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-left: 3px solid var(--border-1);
  border-radius: 8px;
  padding: 9px 11px;
}
.rule-tier.ok { border-left-color: var(--ok); }
.rule-tier.warn { border-left-color: var(--warn); }
.rule-tier.err { border-left-color: var(--err); }
.rule-tier-k { font-size: 12px; font-weight: 600; color: var(--fg-1); }
.rule-tier-v { font-size: 12px; color: var(--fg-3); margin-top: 2px; }

.sub-block {
  margin: 6px 0 4px 12px;
  padding-left: 12px;
  border-left: 2px solid var(--border-2);
}

.stack { display: flex; flex-direction: column; gap: 8px; }
.inline { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

.banner {
  padding: 9px 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 13px;
  white-space: pre-wrap;
}
.banner.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.banner.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.banner.err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }

.console-out {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: Consolas, ui-monospace, Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 10px 12px;
  max-height: 300px;
  overflow: auto;
  margin-top: 10px;
}

details.fold {
  margin-top: 10px;
  border-top: 1px solid var(--border-2);
  padding-top: 8px;
}
details.fold > summary {
  cursor: pointer;
  color: var(--fg-2);
  font-weight: 500;
  font-size: 12.5px;
}

.item-card {
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 10px 12px;
  margin-top: 8px;
}

.export-result {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  margin: 10px 0 12px;
  background: color-mix(in srgb, var(--ok) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--ok) 32%, transparent);
}
.export-result-meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  min-width: 240px;
}
.export-result-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ok);
}
.export-result-path {
  font-size: 11.5px;
  color: var(--fg-2);
  word-break: break-all;
}

.path-row-ctrl {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  max-width: 560px;
}
.path-chip {
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--fg-2);
  word-break: break-all;
