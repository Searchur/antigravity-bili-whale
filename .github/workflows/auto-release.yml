name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version and synchronize manifests
        id: ver
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const tagExists = tag => Boolean(execFileSync('git', ['tag', '-l', tag], { encoding: 'utf8' }).trim())
          const manifest = JSON.parse(fs.readFileSync('plugin.json', 'utf8'))
          const current = manifest.version
          if (!/^\d+\.\d+\.\d+$/.test(current)) throw new Error('plugin.json must contain a stable version')
          let target = current
          if (tagExists(`v${target}`)) {
            const [major, minor, patch] = current.split('.').map(Number)
            let nextPatch = patch
            do { target = `${major}.${minor}.${++nextPatch}` } while (tagExists(`v${target}`))
          }

          const syncJsonVersion = (file, getRoot) => {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'))
            const root = getRoot(value)
            if (value.version === target && root.version === target) return
            value.version = root.version = target
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n', 'utf8')
          }
          for (const file of ['plugin.json', 'package.json']) syncJsonVersion(file, value => value)
          syncJsonVersion('package-lock.json', value => value.packages[''])

          for (const file of ['src/mcp/server.mjs', 'web/bridge.mjs']) {
            const src = fs.readFileSync(file, 'utf8')
            const pattern = /(version:\s*)'\d+\.\d+\.\d+'/
            if (!pattern.test(src)) throw new Error(`Version declaration missing in ${file}`)
            const updated = src.replace(pattern, `$1'${target}'`)
            if (updated !== src) fs.writeFileSync(file, updated, 'utf8')
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${target}\n`)
          console.log(`Resolved release version: v${target}`)
          EOF

      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ffmpeg for cover decoding tests
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Build and test release
        run: |
          npm run build:ui
          npm run check:structure
          npm test
          node --input-type=module -e 'import { validatePluginPayload } from "./src/plugin/install.mjs"; validatePluginPayload(process.cwd())'

      - name: Sync verified release files to main
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git add plugin.json package.json package-lock.json src/mcp/server.mjs web/bridge.mjs dist/app.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG [skip ci]"
            git push origin HEAD:main
          else
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          fi

      - name: Build clean release archive and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          ZIP_PATH="$(node scripts/package-release.mjs --out-dir "${{ runner.temp }}/release-assets" --tag "$TAG" --commit "$COMMIT_SHA" --print-path)"
          test -f "$ZIP_PATH"
          echo "Packaged release asset: $ZIP_PATH"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$ZIP_PATH" --title "$TAG" --generate-notes
