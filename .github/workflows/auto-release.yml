name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version and synchronize manifests
        id: ver
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const manifest = JSON.parse(fs.readFileSync('plugin.json', 'utf8'))
          const current = manifest.version
          if (!/^\d+\.\d+\.\d+$/.test(current)) throw new Error('plugin.json must contain a stable version')
          const [major, minor, patch] = current.split('.').map(Number)
          const tags = execFileSync('git', ['tag', '--list', `v${major}.${minor}.*`,
            '--format=%(refname:strip=2) %(contents:trailers:key=Source-Commit,valueonly)'], { encoding: 'utf8' })
          let nextPatch = patch
          let existingTag
          for (const line of tags.split(/\r?\n/)) {
            const [tag, source] = line.split(' ')
            const match = /^v\d+\.\d+\.(\d+)$/.exec(tag)
            if (!match) continue
            nextPatch = Math.max(nextPatch, Number(match[1]) + 1)
            if (source === process.env.GITHUB_SHA) existingTag = tag
          }
          const target = existingTag ? existingTag.slice(1) : `${major}.${minor}.${nextPatch}`

          const syncJsonVersion = (file, getRoot) => {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'))
            const root = getRoot(value)
            if (value.version === target && root.version === target) return
            value.version = root.version = target
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n', 'utf8')
          }
          for (const file of ['plugin.json', 'package.json']) syncJsonVersion(file, value => value)
          syncJsonVersion('package-lock.json', value => value.packages[''])

          for (const file of ['src/mcp/server.mjs', 'web/bridge.mjs']) {
            const src = fs.readFileSync(file, 'utf8')
            const pattern = /(version:\s*)'\d+\.\d+\.\d+'/
            if (!pattern.test(src)) throw new Error(`Version declaration missing in ${file}`)
            const updated = src.replace(pattern, `$1'${target}'`)
            if (updated !== src) fs.writeFileSync(file, updated, 'utf8')
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${target}\nreuse=${Boolean(existingTag)}\n`)
          console.log(`Resolved release version: v${target}`)
          EOF

      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ffmpeg for cover decoding tests
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Build and test release
        run: |
          npm run build:ui
          npm run check:structure
          npm test
          node --input-type=module -e 'import { validatePluginPayload } from "./src/plugin/install.mjs"; validatePluginPayload(process.cwd())'

      - name: Publish verified files as a release tag and ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          REUSE_TAG: ${{ steps.ver.outputs.reuse }}
        run: |
          REMOTE_MAIN=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${REMOTE_MAIN%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "Skipping publication because main has moved past $GITHUB_SHA."
            exit 0
          fi

          git add plugin.json package.json package-lock.json src/mcp/server.mjs web/bridge.mjs dist/app.html
          if [[ "$REUSE_TAG" == "true" ]]; then
            git diff --cached --exit-code --stat "refs/tags/$TAG"
            COMMIT_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          else
            if ! git diff --cached --quiet; then git commit -m "chore(release): $TAG"; fi
            COMMIT_SHA=$(git rev-parse HEAD)
          fi
          ZIP_PATH="$(node scripts/package-release.mjs --out-dir "${{ runner.temp }}/release-assets" --tag "$TAG" --commit "$COMMIT_SHA" --print-path)"
          test -f "$ZIP_PATH"
          if [[ "$REUSE_TAG" != "true" ]]; then
            git tag -a "$TAG" "$COMMIT_SHA" -m "Release $TAG" -m "Source-Commit: $GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          elif DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$DRAFT" == "true" ]]; then
              gh release upload "$TAG" "$ZIP_PATH" --clobber
              gh release edit "$TAG" --draft=false
            fi
            exit 0
          fi
          gh release create "$TAG" "$ZIP_PATH" --verify-tag --title "$TAG" --generate-notes
